<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>রেজিস্ট্রেশন ফর্ম</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:SolaimanLipi,Arial,sans-serif;
}

body{
background:#f3f4f6;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.form-box{
width:100%;
max-width:420px;
background:#fff;
padding:25px;
border-radius:15px;
box-shadow:0 10px 30px rgba(0,0,0,.15);
}

h2{
text-align:center;
margin-bottom:20px;
color:#222;
}

label{
display:block;
margin-top:15px;
margin-bottom:5px;
font-weight:bold;
}

input{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:8px;
font-size:15px;
outline:none;
}

input:focus{
border-color:#2563eb;
}

button{
width:100%;
margin-top:25px;
padding:14px;
background:#2563eb;
color:#fff;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

.note{
margin-top:15px;
font-size:13px;
color:#666;
text-align:center;
}

</style>

</head>

<body>

<div class="form-box">

<h2>রেজিস্ট্রেশন ফর্ম</h2>

<form>

<label>আপনার নাম</label>
<input type="text" placeholder="আপনার নাম লিখুন" required>

<label>জেলা</label>
<input type="text" placeholder="আপনার জেলা লিখুন" required>

<label>বয়স</label>
<input type="number" placeholder="আপনার বয়স লিখুন" required>

<label>ফোন নম্বর</label>
<input type="tel" placeholder="০১XXXXXXXXX" required>

<label>ইমেইল (ঐচ্ছিক)</label>
<input type="email" placeholder="আপনার ইমেইল">

<button type="submit">
রেজিস্ট্রেশন করুন
</button>

</form>

<div class="note">
আপনার তথ্য নিরাপদভাবে ব্যবহার করা হবে।
</div>

</div>

</body>
</html>
